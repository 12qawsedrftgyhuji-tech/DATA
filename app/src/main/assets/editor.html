<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin:0; padding:8px; font-family:sans-serif; font-size:15px; }
        #editor { min-height:340px; outline:none; line-height:1.6; }
        #editor img { max-width:100%; height:auto; display:block; margin:6px 0; border-radius:6px; }
    </style>
</head>
<body>
<div id="editor" contenteditable="true"></div>
<script>
    const editor = document.getElementById('editor');

    function insertImageAtCursor(url) {
        const img = document.createElement('img');
        img.src = url;
        const selection = window.getSelection();
        if (selection.rangeCount > 0 && editor.contains(selection.anchorNode)) {
            const range = selection.getRangeAt(0);
            range.deleteContents();
            range.insertNode(img);
            range.collapse(false);
        } else {
            editor.appendChild(img);
        }
        editor.appendChild(document.createElement('br'));
    }

    // 새로 추가: 텍스트 삽입
    function insertTextAtCursor(text) {
        const selection = window.getSelection();
        if (selection.rangeCount > 0 && editor.contains(selection.anchorNode)) {
            const range = selection.getRangeAt(0);
            range.deleteContents();
            range.insertNode(document.createTextNode(text));
            range.collapse(false);
        } else {
            editor.appendChild(document.createTextNode(text));
        }
    }

    function getEditorContent() { return editor.innerHTML; }
    function setEditorContent(html) { editor.innerHTML = html; }
</script>
</body>
</html>
